	#Server/world settings. These affect gameplay for everyone in this world.
	[physicsApi.buoyancyAndBallast]
		#Reduces vertical bobbing. Default 0.42; try 0.55 if the ship bounces excessively. Does not increase static flotation. Large values can make wave response sluggish.
		# Default: 0.42
		# Range: 0.0 ~ 4.0
		displacementVerticalDamping = 0.42
		#Enable displacement-based buoyancy for Sable ships. This samples submerged hull volume and applies buoyant force at the centre of buoyancy.
		waterDisplacementEnabled = true
		#Give sealed air compartments a slight buoyancy assist.
		compartmentBuoyancyEnabled = true
		#Ballast controller strength, default 2. Affects upward and downward corrections; lowering it does not simply add buoyancy. Empty ballast tanks when testing surface flotation.
		# Default: 2.0
		# Range: 0.0 ~ 10.0
		ballastSinkScale = 2.0
		#Main flotation control. Default 0.085; try 0.1 then 0.12 if a sealed, drained ship sits too low. Higher values lift the same submerged volume more strongly; lower if it rides too high. Changes all ships, not just the one you are testing.
		# Default: 0.085
		# Range: 0.0 ~ 500.0
		displacementForcePerBlock = 72.0
		#Maximum hull samples per ship per physics step. Default 4096. Increase only if large-ship sampling is visibly uneven; this costs server CPU. It improves sampling accuracy rather than multiplying lift. Client quality presets do not change this.
		# Default: 4096
		# Range: 128 ~ 32000
		displacementSampleBudget = 4096
		#Safety cap on displacement force relative to ship weight. Default 1.0 keeps fully submerged ships from receiving more buoyancy force than their weight. Larger caps allow stronger ascent and sharper motion.
		# Default: 1.0
		# Range: 0.0 ~ 12.0
		displacementMaxForcePerMass = 1.65

	#Server/world settings. These affect gameplay for everyone in this world.
	[physicsApi.windAndCurrents]
		#Allow currents to push players in water.
		currentsAffectPlayers = true
		#Sailing force model. SIMULATION uses apparent wind and boom trim. ARCADE uses true wind and sail hoist only.
		#Allowed Values: SIMULATION, ARCADE
		sailingMode = "ARCADE"
		#Enable wind sampling and wind motion.
		windEnabled = true
		#Base wind speed in blocks/sec. Higher values make full arcade sails target higher ship speeds.
		# Default: 6.0
		# Range: 0.0 ~ 64.0
		windBaseSpeed = 6.0
		#Allow currents to push non-player, non-item entities in water.
		currentsAffectEntities = true
		#How aggressively arcade sails accelerate ships toward wind speed. Higher values reach target speed faster.
		# Default: 1.6
		# Range: 0.05 ~ 16.0
		arcadeSailAcceleration = 1.6
		#Allow currents to push guardians. Disabled by default so ocean mobs keep normal movement.
		currentsAffectGuardians = false
		#Base current speed in blocks/sec.
		# Default: 0.18
		# Range: 0.0 ~ 8.0
		currentsBaseSpeed = 0.18
		#Enable current sampling and current motion.
		currentsEnabled = true
		#Allow currents to push item entities in water.
		currentsAffectItems = true

	#Server/world settings. These affect gameplay for everyone in this world.
	[physicsApi.shipHandlingAndEffects]
		#Enable ship bow waves, widening wakes, foam/spray particles, wave roll/pitch coupling, and lateral water displacement forces.
		shipHydrodynamicsEnabled = false
		#Horizontal drag applied to Sable vehicles touching water. Higher values slow ships faster.
		# Default: 0.018
		# Range: 0.0 ~ 0.2
		waterDragCoefficient = 0.018
		#Scales bow wave, wake, foam, and spray particle emission. Particles are still capped per ship tick.
		# Default: 1.0
		# Range: 0.0 ~ 4.0
		shipWakeParticleScale = 1.0
		#Mass exponent for hydrodynamic drag. Values below 1 make heavy ships accelerate/stop slower than light craft.
		# Default: 0.72
		# Range: 0.35 ~ 1.0
		shipInertiaExponent = 0.72
		#Maximum wake/foam/spray particles emitted per ship effect tick.
		# Default: 18
		# Range: 0 ~ 256
		shipMaxParticlesPerTick = 18
		#How strongly sampled waves roll and pitch Sable ships. Larger values make vessels move more with swell.
		# Default: 0.06
		# Range: 0.0 ~ 1.0
		shipWaveRollForce = 0.06
		#Forward hydrodynamic resistance from bow-wave formation. Scales with speed and displaced volume.
		# Default: 0.055
		# Range: 0.0 ~ 1.0
		shipBowWaveForce = 0.055
		#Minimum ticks between ship wake/foam/spray particle emissions per vessel.
		# Default: 4
		# Range: 1 ~ 40
		shipEffectIntervalTicks = 4
		#Side force used to push water outward around moving hulls and make broad ships disturb more water.
		# Default: 0.03
		# Range: 0.0 ~ 1.0
		shipWaterPushForce = 0.03
		#Optional entry-speed-based hull impact force. The physical slam addition is capped at 15% of ship weight per sample; default 0.15.
		# Default: 0.15
		# Range: 0.0 ~ 2.0
		oceanSlamStrength = 0.15

	#Server/world settings. These affect gameplay for everyone in this world.
	[physicsApi.compartmentsAndFlooding]
		#Allow over-pressured sealed compartments to fail catastrophically.
		compartmentFailureEnabled = false
		#Pressure threshold where sealed compartments start failing.
		# Default: 1.95
		# Range: 1.0 ~ 16.0
		compartmentFailurePressure = 1.95
		#Enable dry-interior occlusion API checks.
		waterOcclusionEnabled = true
		#Minimum sealed compartment volume before pressure failures are considered.
		# Default: 24
		# Range: 1 ~ 4096
		compartmentFailureMinVolume = 24
		#Enable water pressure sampling.
		pressureEnabled = true
		#Cooldown between pressure failures in the same compartment.
		# Default: 120
		# Range: 20 ~ 24000
		compartmentFailureCooldownTicks = 120
		#Base blast strength for compartment implosions.
		# Default: 3.75
		# Range: 0.0 ~ 16.0
		compartmentFailureExplosionPower = 3.75
		#Extra pressure per block below sea level.
		# Default: 0.08
		# Range: 0.0 ~ 2.0
		pressureDepthScale = 0.08
		#Place native water blocks inside flooded ships. Disable for overlay-only flood visuals, especially on rolling/capsized ships. Logical flooding, pumps, air-displacement loss and optional extra flood weight remain active. Native fluid mass and block-driven fluid interactions are not supplied by the overlay. Tracked placed water is removed gradually; old untracked water is not removed.
		placeFloodWaterBlocks = false

	#Server/world settings. These affect gameplay for everyone in this world.
	[physicsApi.wavesAndTides]
		#Enable deterministic Waterworks wave sampling.
		wavesEnabled = false
		#Horizontal wave scale. Higher values make waves broader.
		# Default: 1.0
		# Range: 0.1 ~ 12.0
		waveHorizontalScale = 1.0
		#Wave time-speed multiplier. Affects the shared wave field, not frame rate. Leave unchanged when tuning client performance.
		# Default: 1.0
		# Range: 0.0 ~ 8.0
		waveSpeed = 1.0
		#Number of deterministic wave octaves to sample.
		# Default: 13
		# Range: 1 ~ 24
		waveIterations = 13
		#Deterministic wave seed. Clients with the same seed see the same waves.
		# Default: 1337
		# Range: > -2147483648
		waveSeed = 1337
		#Base wave height shared by visuals and ship physics. Raising it changes sea conditions and ship motion, not just graphics quality.
		# Default: 0.85
		# Range: 0.0 ~ 8.0
		waveHeight = 0.85
		#Additional storm amplitude, shared by visuals and physics and bounded by oceanMaxHeight.
		# Default: 1.8
		# Range: 1.0 ~ 3.0
		oceanStormGain = 1.8
		#Maximum shared wave height in blocks. Default 6. Raising allows larger waves and changes ship motion; this is a sea-state control, not a quality slider.
		# Default: 6.0
		# Range: 0.1 ~ 16.0
		oceanMaxHeight = 6.0
		#Long-swell strength multiplier. Default 1. Increase for stronger rolling swells; affects visuals and buoyancy together.
		# Default: 1.0
		# Range: 0.0 ~ 2.0
		oceanSwellGain = 1.0
		#Short-wave strength multiplier. Default 1. Increase for choppier seas; affects visuals and physics, not mesh resolution.
		# Default: 1.0
		# Range: 0.0 ~ 2.0
		oceanChopGain = 1.0
		#Sea-state transition duration in ticks, 20 ticks per second. Default 2400 (two minutes). Raise for slower changes in conditions.
		# Default: 2400.0
		# Range: 200.0 ~ 24000.0
		oceanTransitionTicks = 2400.0
		#Enable bounded near-surface body surfing. Does not apply forces to ships.
		surfingEnabled = true
		#Peak-to-trough shared surface offset; does not move water blocks.
		# Default: 0.0
		# Range: 0.0 ~ 1.0
		oceanTideRange = 0.0

	#Server/world settings. These affect gameplay for everyone in this world.
	[physicsApi.coastalBehaviour]
		#Multiplier applied to currents and waves in beach/coastal biomes.
		# Default: 0.2
		# Range: 0.0 ~ 8.0
		coastalBiomeSurfaceMultiplier = 0.2
		#Multiplier applied to currents, waves, and pressure in deep ocean biomes.
		# Default: 1.75
		# Range: 0.0 ~ 8.0
		deepOceanBiomePhysicsMultiplier = 1.75
		#Multiplier applied to currents, waves, and pressure in ocean biomes.
		# Default: 1.25
		# Range: 0.0 ~ 8.0
		oceanBiomePhysicsMultiplier = 1.25
		#Multiplier applied to currents and waves in river biomes.
		# Default: 0.18
		# Range: 0.0 ~ 8.0
		riverBiomeSurfaceMultiplier = 0.18

	#Server/world settings. These affect gameplay for everyone in this world.
	[physicsApi.legacyBuoyancy]
		#Legacy buoyancy assist and entity behaviour. Not the main Sable ship flotation control while waterDisplacementEnabled is true; use displacementForcePerBlock. Values below 0.052 are currently clamped by the accessor.
		# Default: 0.052
		# Range: 0.0 ~ 0.18
		compartmentBuoyancyLift = 0.052
		#Legacy ship-motion multiplier, bypassed when displacement buoyancy is enabled. For current Sable ships use displacementForcePerBlock and sealed, drained compartments. Values below 28 are currently clamped.
		# Default: 28.0
		# Range: 0.0 ~ 96.0
		airPocketBuoyancyScale = 28.0

	#Server/world settings. These affect gameplay for everyone in this world.
	[physicsApi.performance]
		#Snapshot capture work allowance. Larger budgets finish scans sooner but can cause longer game ticks. Reduce when ship edits cause stutters; no loss of room detail, but results arrive later.
		# Default: 16000
		# Range: 1024 ~ 96000
		compartmentScanMaxBlocks = 16000
		#Scan scheduling interval in game ticks (20 ticks = one second). Increasing delays discovery/refresh; it is not a room-size limit. Pending scans continue within their work budget.
		# Default: 5
		# Range: 1 ~ 100
		compartmentScanIntervalTicks = 5
		#Max number of blocks to check for a seal. Anything larger than this will be considered open.
		# Default: 4096
		# Range: 1024 ~ 65535
		maxCompartmentBlocksChecked = 4096
		#Maximum new/expired coastal lattice samples per level per tick. Stale samples are reused while deferred.
		# Default: 128
		# Range: 16 ~ 2048
		oceanCoastalSamplingBudget = 128

	#Server/world settings. These affect gameplay for everyone in this world.
	[physicsApi.general]
		#Master switch for Waterworks physics API.
		enabled = true

	[physicsApi.floodWaterWeight]
		#Optional EXTRA floodwater weight in Sable mass units per logically flooded block. Default 0 disables it and preserves existing handling. Try 250, then 500 or 1000 on a test ship. Adds downward force at the flooded water centre without changing intact buoyancy. This is additional gameplay weight, not a replacement for native fluid mass or lost air displacement. Requires an active tracked flood; cannot sink untracked wreckage.
		# Default: 0.0
		# Range: 0.0 ~ 10000.0
		extraMassPerBlock = 0.0
		#Maximum EXTRA downward force as a fraction of the ship's current weight, shared across all flooded rooms. Default 1 means at most one additional ship-weight. 0 disables the force. Start at 1; higher values can cause rapid sinking and strong listing. The cap does not guarantee sinking.
		# Default: 1.0
		# Range: 0.0 ~ 5.0
		maxExtraWeightRatio = 1.0

