#Ground contact damage and assisted capsize dynamics. Existing buoyancy remains active.
[damageControl]
	#Damage actual hull blocks touching loaded terrain. Conservative bounded probes can miss very fast or narrow contacts.
	groundingEnabled = true
	#Contact-point speed in blocks/second for a grounding crack. Default 2; raise to make gentle docking safer.
	# Default: 2.0
	# Range: 0.1 ~ 100.0
	groundingCrackSpeed = 2.0
	#Contact-point speed for a broken hull block, before material resistance. Default 6. At most one damaged block per ship per second.
	# Default: 6.0
	# Range: 0.1 ~ 200.0
	groundingBreachSpeed = 6.0
	#Assist rolling only after sustained negative estimated GM on a partially flooded surface vessel. Uses forces, never teleports or forces an exact 180-degree rotation.
	capsizeEnabled = true
	#Maximum additional roll acceleration in radians/second squared. Default 0.08. Lower for gentler instability; 0 disables the assist. Estimate is approximate, not a naval stability solver.
	# Default: 0.08
	# Range: 0.0 ~ 1.0
	capsizeAcceleration = 0.08
